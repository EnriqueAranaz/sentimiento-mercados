# Fuentes de titulares (Fase 1: ingesta).
# Este fichero es la fuente de verdad: en cada ejecución se sincroniza con la tabla `fuentes`
# de Supabase (por `nombre`). Para desactivar una fuente basta con poner `activa: false`.
#
# Campos de cada fuente:
#   nombre        nombre único (clave de sincronización con la tabla `fuentes`)
#   clave         identificador corto para la CLI (--solo <clave>)
#   tipo_fuente   medio | portal | comunidad
#   tipo_acceso   rss | html  (cómo se accede mayoritariamente)
#   url           web de referencia de la sección
#   idioma        es
#   activa        true | false
#   motivo        (opcional) por qué está desactivada o notas de viabilidad
#   fecha_desde_articulo  (opcional) true: a los artículos nuevos sin fecha se les abre la página
#                 (1 pet/s) para tomar la fecha real (article:published_time o JSON-LD datePublished)
#   max_fechas_por_ejecucion  (opcional, 80 por defecto) tope de páginas de artículo abiertas por ejecución
#   clave_url     (opcional) regex con un grupo: identificador del artículo en la URL (articulos.clave_fuente,
#                 único por fuente). Si ya está guardado, la noticia no se vuelve a insertar (ingesta/duplicados.py)
#   duplicado_por_titulo_h  (opcional) horas: un artículo con el mismo titular normalizado que otro de la fuente
#                 en ese plazo se guarda con duplicado_de = el primero (las vistas lo excluyen)
#   listados      lista de listados a recorrer, cada uno con:
#       url           URL de la primera página
#       url_pagina    (opcional) plantilla para páginas 2..N, con {n}
#       url_dia / url_dia_pagina  (en lugar de url) archivo por días, con {fecha} (AAAA-MM-DD) y {n}:
#                     se recorre desde hoy hasta el día de la ejecución anterior (hora de Madrid)
#       max_paginas   (opcional) tope de páginas de este listado (por defecto defaults.max_paginas)
#       parser        rss | sitemap_news | html_enlaces | tradingview_json
#       seccion       etiqueta que se guarda en articulos.seccion
#       detecta_hueco true por defecto; false en listados complementarios de una sola página
#       selector / patron_url   solo para html_enlaces
#   Se para al encontrar una URL ya guardada; si se agotan las páginas sin encontrarla -> 'parcial'.

defaults:
  max_paginas: 10
  timeout_s: 20
  intervalo_dominio_s: 1.0
  user_agent: "BolsaSentimentBot/0.1 (proyecto personal de seguimiento de titulares; contacto: aranaz.enrique@gmail.com)"

fuentes:
  # ------------------------------------------------------------------ medios
  - nombre: El Economista
    clave: eleconomista
    tipo_fuente: medio
    tipo_acceso: html
    url: https://www.eleconomista.es/mercados-cotizaciones/
    idioma: es
    activa: false
    motivo: "Akamai devuelve 403 'Access Denied' a cualquier petición automatizada (incluido robots.txt y el RSS)."
    listados:
      - url: https://www.eleconomista.es/rss/rss-mercados.php
        parser: rss
        seccion: mercados

  - nombre: Expansión
    clave: expansion
    tipo_fuente: medio
    tipo_acceso: rss
    url: https://www.expansion.com/mercados.html
    idioma: es
    activa: true
    motivo: "RSS oficiales de Mercados (~50 entradas, ~3 días) y Empresas (~50, ~1 día). Solo titular y entradilla pública; nunca se abre el artículo."
    listados:
      - url: https://e00-expansion.uecdn.es/rss/mercados.xml
        parser: rss
        seccion: mercados
      - url: https://e00-expansion.uecdn.es/rss/empresas.xml
        parser: rss
        seccion: empresas

  - nombre: Cinco Días
    clave: cincodias
    tipo_fuente: medio
    tipo_acceso: rss
    url: https://cincodias.elpais.com/mercados-financieros/
    idioma: es
    activa: true
    motivo: "El HTML devuelve 403 a bots; se usan los feeds oficiales de PRISA (feeds.elpais.com): Mercados financieros (~28 entradas, ~3 días) y Empresas (~30, ~1,5 días)."
    listados:
      - url: https://feeds.elpais.com/mrss-s/pages/ep/site/cincodias.elpais.com/section/mercados-financieros/portada
        parser: rss
        seccion: mercados-financieros
      # La sección "Empresas" de Cinco Días tiene la ruta /companias/ (el feed /empresas/ no existe).
      - url: https://feeds.elpais.com/mrss-s/pages/ep/site/cincodias.elpais.com/section/companias/portada
        parser: rss
        seccion: empresas

  # ------------------------------------------------------------------ portales
  - nombre: Bolsamanía
    clave: bolsamania
    tipo_fuente: portal
    tipo_acceso: html
    url: https://www.bolsamania.com/ultimas/index.html
    idioma: es
    activa: true
    motivo: "Fuente principal: archivo diario de Últimas (/noticias/ultimas/AAAA-MM-DD/N), completo y paginable (~35-40 noticias por día laborable). Agrupa por día de creación, así que las noticias programadas para días posteriores se recogen con el sitemap de noticias y los listados de sección. Las que llegan sin fecha toman la real de la página del artículo (JSON-LD datePublished)."
    fecha_desde_articulo: true
    clave_url: '--(\d+)\.html$'   # el archivo y el sitemap dan la misma noticia con slugs distintos
    listados:
      - url_dia: https://www.bolsamania.com/noticias/ultimas/{fecha}
        url_dia_pagina: https://www.bolsamania.com/noticias/ultimas/{fecha}/{n}
        max_paginas: 15
        parser: html_enlaces
        seccion: archivo
        selector: "article h1 a, article h2 a, article h3 a, article h4 a"
        patron_url: '^https://www\.bolsamania\.com/noticias/[^?#]+--\d+\.html$'
      - url: https://www.bolsamania.com/sitemap.xml
        parser: sitemap_news
        seccion: sitemap
        detecta_hueco: false
      - url: https://www.bolsamania.com/ultimas/index.html
        parser: html_enlaces
        seccion: ultimas
        detecta_hueco: false
        selector: "article h1 a, article h2 a, article h3 a, article h4 a"
        patron_url: '^https://www\.bolsamania\.com/noticias/[^?#]+--\d+\.html$'
      - url: https://www.bolsamania.com/mercados/index.html
        parser: html_enlaces
        seccion: mercados
        detecta_hueco: false
        selector: "article h1 a, article h2 a, article h3 a, article h4 a"
        patron_url: '^https://www\.bolsamania\.com/noticias/[^?#]+--\d+\.html$'
      - url: https://www.bolsamania.com/empresas/index.html
        parser: html_enlaces
        seccion: empresas
        detecta_hueco: false
        selector: "article h1 a, article h2 a, article h3 a, article h4 a"
        patron_url: '^https://www\.bolsamania\.com/noticias/[^?#]+--\d+\.html$'
      - url: https://www.bolsamania.com/internacional/index.html
        parser: html_enlaces
        seccion: internacional
        detecta_hueco: false
        selector: "article h1 a, article h2 a, article h3 a, article h4 a"
        patron_url: '^https://www\.bolsamania\.com/noticias/[^?#]+--\d+\.html$'

  # Sección de Bolsamanía (mismo dominio): comparte con ella el límite de 1 pet/s por dominio.
  - nombre: CapitalBolsa
    clave: capitalbolsa
    tipo_fuente: portal
    tipo_acceso: html
    url: https://www.bolsamania.com/capitalbolsa
    idioma: es
    activa: true
    motivo: "Principal: archivo diario de Minuto a minuto (/capitalbolsa/noticias/minuto-a-minuto/AAAA-MM-DD/N); complementos: listados de sección y su sitemap de noticias. Sin fecha en listados: fecha real de la página del artículo. Excluida la promoción de pago (sección destacadas y titulares de CB Premium)."
    fecha_desde_articulo: true
    max_fechas_por_ejecucion: 150   # la primera lectura trae ~140 sin fecha; luego solo las nuevas
    excluir_titulo: '(?i)\bCB Premium\b|Servicio Premium|Capital ?Bolsa Premium'
    clave_url: '--(\d+)\.html$'
    listados:
      - url_dia: https://www.bolsamania.com/capitalbolsa/noticias/minuto-a-minuto/{fecha}
        url_dia_pagina: https://www.bolsamania.com/capitalbolsa/noticias/minuto-a-minuto/{fecha}/{n}
        max_paginas: 15
        parser: html_enlaces
        seccion: minuto-a-minuto
        selector: "article h6 a"   # CapitalBolsa pone los titulares en <h6>
        # La sección real sale de la URL; `destacadas` (promoción de CB Premium) queda fuera.
        patron_url: '^https://www\.bolsamania\.com/capitalbolsa/noticias/(?!destacadas/)(?P<seccion>[a-z0-9-]+)/[^?#]+--\d+\.html$'
      - url: https://www.bolsamania.com/capitalbolsa/sitemap.xml
        parser: sitemap_news
        seccion: sitemap
        detecta_hueco: false
      - &cb_seccion
        url: https://www.bolsamania.com/capitalbolsa/noticias/gurus-de-mercado
        parser: html_enlaces
        seccion: gurus-de-mercado
        detecta_hueco: false
        selector: "article h6 a"
        patron_url: '^https://www\.bolsamania\.com/capitalbolsa/noticias/(?!destacadas/)(?P<seccion>[a-z0-9-]+)/[^?#]+--\d+\.html$'
      - {<<: *cb_seccion, url: "https://www.bolsamania.com/capitalbolsa/noticias/recomendaciones", seccion: recomendaciones}
      - {<<: *cb_seccion, url: "https://www.bolsamania.com/capitalbolsa/noticias/bolsa", seccion: bolsa}
      - {<<: *cb_seccion, url: "https://www.bolsamania.com/capitalbolsa/noticias/economia", seccion: economia}
      - {<<: *cb_seccion, url: "https://www.bolsamania.com/capitalbolsa/noticias/empresas", seccion: empresas}
      - {<<: *cb_seccion, url: "https://www.bolsamania.com/capitalbolsa/noticias/materias-primas", seccion: materias-primas}
      - {<<: *cb_seccion, url: "https://www.bolsamania.com/capitalbolsa/noticias/renta-fija", seccion: renta-fija}

  - nombre: Investing.com
    clave: investing
    tipo_fuente: portal
    tipo_acceso: rss
    url: https://es.investing.com/news/stock-market-news
    idioma: es
    activa: false
    motivo: "Cloudflare devuelve 403 al HTML y a robots.txt (no se puede verificar). El RSS responde pero solo trae 10 entradas (~40 min), inútil para un hueco de 15 h."
    listados:
      - url: https://es.investing.com/rss/news_25.rss
        parser: rss
        seccion: stock-market-news

  - nombre: TradingView
    clave: tradingview
    tipo_fuente: portal
    tipo_acceso: html
    url: https://es.tradingview.com/news/
    idioma: es
    activa: true
    motivo: "El HTML incluye (renderizado en servidor) un JSON con las últimas noticias (~110 entradas en varios bloques). 'Cargar más' requiere JavaScript, así que no hay paginación. La página de Reuters se probó y no aportaba URLs nuevas."
    duplicado_por_titulo_h: 48   # Reuters reenvía la misma noticia con otro identificador
    listados:
      - url: https://es.tradingview.com/news/
        parser: tradingview_json
        seccion: news
