name: Ingesta de titulares

# Sin `schedule`: el programador de GitHub no fue fiable (horas en zona equivocada y ejecuciones
# que no llegaban). Lo lanza cron-job.org a las 9:30 (apertura) y 18:00 (cierre) Europe/Madrid
# llamando a la API de GitHub (workflow_dispatch con el input `franja`). Ver README.
on:
  workflow_dispatch:
    inputs:
      franja:
        description: 'Franja con la que se registra la ejecución'
        type: choice
        options: [manual, apertura, cierre]
        default: manual

# Evita dos ingestas simultáneas (p. ej. una manual solapada con una de cron-job.org).
concurrency:
  group: ingesta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingesta:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Franja
        env:
          FRANJA: ${{ inputs.franja }}
        run: |
          echo "Franja: ${FRANJA:-manual} (hora Madrid $(TZ=Europe/Madrid date '+%d/%m %H:%M'))"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ingesta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRANJA: ${{ inputs.franja }}
          PYTHONIOENCODING: utf-8
        run: python -m ingesta --franja "${FRANJA:-manual}"
